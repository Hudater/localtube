name: Build and release

# See docs/BUILD.md for the full build / sign / release contract.
#
# Triggers:
#   - push to main, pull_request to main: build debug APK + run unit tests,
#     upload the debug APK as a workflow artifact (sideloadable without
#     cutting a tag).
#   - push of a tag matching v*: build a signed release APK and attach it
#     to a GitHub Release.
#
# Required secrets (only for the signed-release job on a v* tag):
#   RELEASE_KEYSTORE_BASE64   base64-encoded release.keystore
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to create the GitHub Release on a v* tag

jobs:
  # ----------------------------------------------------------------------
  # Debug build + tests on every push/PR.
  # ----------------------------------------------------------------------
  debug:
    name: Build debug APK + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Gradle wrapper
        # gradle-wrapper.jar isn't committed (see docs/BUILD.md). Install a
        # one-shot system Gradle, generate the wrapper jar, then cache it
        # locally for the rest of the job.
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.9

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Signed release + GitHub Release on a v* tag push.
  # ----------------------------------------------------------------------
  release:
    name: Signed release APK + GitHub Release
    needs: debug
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Bootstrap Gradle wrapper
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle wrapper --gradle-version 8.9

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode release keystore
        # RELEASE_KEYSTORE_BASE64 is the base64 of release.keystore. We
        # write it to a temp path and pass that path via
        # RELEASE_KEYSTORE_PATH so the app/build.gradle.kts signing block
        # picks it up unchanged.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is required for a signed release}"
          mkdir -p "$RUNNER_TEMP/keystore"
          echo -n "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Locate signed APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk }}
