name: Build and release

# See docs/BUILD.md for the full build / sign / release contract.
#
# Triggers:
#   - push to main, pull_request to main: exactly ONE workflow run per
#     push. A `meta` job detects whether the pushed commit carries a v*
#     tag: untagged pushes build a debug APK + run unit tests (uploaded as
#     an artifact); tagged pushes build the signed release APK and attach
#     it to a GitHub Release. Tags are NOT a workflow trigger — pushing a
#     commit and its tag together must not produce two runs.
#
# Required secrets (only for the signed-release job on a tagged push):
#   RELEASE_KEYSTORE_BASE64   base64-encoded release.keystore
#   RELEASE_KEYSTORE_PASSWORD keystore password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write   # needed to create the GitHub Release on a tagged push

jobs:
  # ----------------------------------------------------------------------
  # Detect whether the pushed commit is tagged v* → release vs debug path.
  # ----------------------------------------------------------------------
  meta:
    name: Detect release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - name: Checkout (full history, for tag detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect v* tag on HEAD
        id: detect
        run: |
          TAG=$(git describe --exact-match --tags HEAD 2>/dev/null || true)
          if [[ "$TAG" == v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # ----------------------------------------------------------------------
  # Debug build + tests on untagged pushes/PRs.
  # ----------------------------------------------------------------------
  debug:
    name: Build debug APK + tests
    needs: meta
    if: needs.meta.outputs.release != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.jar isn't committed (see docs/BUILD.md), so we use
      # the system `gradle` that setup-gradle installs on PATH instead of
      # `./gradlew`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Dump resolved compose versions
        run: gradle :app:dumpComposeVersions

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ----------------------------------------------------------------------
  # Signed release + GitHub Release on a tagged push.
  # ----------------------------------------------------------------------
  release:
    name: Signed release APK + GitHub Release
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Decode release keystore
        # RELEASE_KEYSTORE_BASE64 is the base64 of release.keystore. We
        # write it to a temp path and pass that path via
        # RELEASE_KEYSTORE_PATH so the app/build.gradle.kts signing block
        # picks it up unchanged.
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 secret is required for a signed release}"
          mkdir -p "$RUNNER_TEMP/keystore"
          echo -n "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Locate signed APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.apk }}
